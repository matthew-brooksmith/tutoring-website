# Builds and publishes the site to GitHub Pages on every push to master.
#
# Mirrors the same workflow used on the photography site, for two reasons:
#   1. An allow-list of published files — only the files the site actually
#      needs are copied into _site/, so anything else left in the repo
#      (this is why assets/poster.png, unused by the live page, stops
#      being served) never reaches the web.
#   2. Every image has any GPS/camera/owner metadata stripped before
#      publishing, the same as a landscape photo would. matt.jpg currently
#      carries none, but this means a future photo dropped into assets/
#      can't quietly leak that by accident.
#
# Requires Settings → Pages → Source → "GitHub Actions" (not "Deploy from
# a branch") on this repo before it will publish anything.
name: Deploy tutoring website

on:
  push:
    branches: [master]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

# Least privilege: this workflow can read the repo and publish Pages.
# It cannot write to the repository, open issues, or touch anything else.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave a credential lying around in .git/config for the
          # rest of the job. Nothing here needs to push.
          persist-credentials: false

      - name: Install exiftool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl

      - name: Assemble the published site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          # An explicit allow-list. Anything not named here is never
          # published — in particular assets/poster.png, which isn't used
          # by index.html and was previously being served anyway.
          cp index.html style.css script.js availability.js _site/
          cp assets/matt.jpg assets/cern.png assets/imperial.png _site/assets/
          # macOS folder metadata should never reach the web.
          find _site -name '.DS_Store' -delete
          find _site -name '._*' -delete

      - name: Strip metadata from every image
        run: |
          set -euo pipefail
          # -all= deletes every tag; the two -tagsfromfile @ copies put back
          # the only two actually needed, both harmless:
          #   icc_profile — the colour profile, so colours don't shift.
          #   Orientation — the rotate flag, so a portrait photo doesn't
          #                 display on its side.
          # This is a tag-level edit, not a re-encode: pixels are untouched.
          exiftool -all= -tagsfromfile @ -icc_profile -Orientation \
                   -overwrite_original -r -q -q _site/assets
          echo "Metadata stripped (colour profile and orientation preserved)."

      - name: Verify nothing identifying survived
        run: |
          set -euo pipefail
          LEAKS=$(exiftool -q -q -m -s3 -r \
                    -gps:all -serialnumber -bodyserialnumber -internalserialnumber \
                    -lensserialnumber -ownername -artist -cameraid \
                    _site/assets 2>/dev/null | tr -d '[:space:]')
          if [ -n "$LEAKS" ]; then
            echo "::error::Identifying metadata is still present in a published image. Refusing to deploy."
            exiftool -r -gps:all -serialnumber -ownername -artist _site/assets
            exit 1
          fi
          echo "No GPS coordinates, serial numbers or owner names in any image."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
